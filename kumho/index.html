    <strong>Why do we use it?</strong>
    <p>금호건설은 <span>1967</span>년 창립한 이후 도심공항터미널, 아셈 컨벤션 센터, 인천국제공항, 천안-논산간 고속도로, 인천 <span>LNG</span> 생산기지 저장탱크 등을 건설하면서 국가 기반시설 설립을 주도해 왔으며, <span>2022</span>년 3월 국내 하수처리시설 건설 기술인 KIDEA 공법으로 첫 장영실 상을 수상하였습니다. 또한 제1회 대한민국 리모델링 대상의 특별상을 수상, 2004년 한국건축문화대상 수상, 2007년 한국의 경영대상 생산성 대상 수상 등 국내 건설업계 최고의 기술력을 자랑하고 있는 기업입니다.</p>
